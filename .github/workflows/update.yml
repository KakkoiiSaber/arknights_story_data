name: Update Data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required to push
          submodules: recursive  # ensure assets_origin* are pulled before running main

      - name: Update submodules to latest remote
        run: |
          git submodule sync --recursive
          git submodule update --init --remote --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Clear cache
        run: python src/utils/clear_cache.py
        
      - name: Update story data
        run: python src/story.py

      - name: Update review data
        run: python src/review.py
        
      - name: Update story data
        run: python src/story.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update data"
          git push
