name: Update Data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required to push
          submodules: recursive  # ensure assets_origin* are pulled before running main

      - name: Update submodules to latest remote
        run: |
          git submodule sync --recursive
          git submodule update --init --remote --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Clear cache
        run: python src/utils/clear_cache.py
        
      - name: Update story data
        run: python src/story.py

      - name: Update review data
        run: |
          python -m unittest discover -s tests
          python src/review.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Publish review version and resource checksums
        env:
          DATA_BRANCH: ${{ github.ref_name }}
        run: |
          node --test scripts/tests/review_manifest.test.mjs
          node scripts/review_manifest.mjs --refresh --public-base="https://raw.githubusercontent.com/KakkoiiSaber/arknights_story_data/$DATA_BRANCH"

      - name: Upload review resource failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: review-resource-report
          path: assets/review_payload/report.json
          if-no-files-found: ignore
        
      - name: Update story data
        run: python src/story.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update data"
          git push
